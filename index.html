
<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
    
      @keyframes researchers-up { from { transform: translateY(0); } to { transform: translateY(calc(-50% - 0.375rem)); } }
      .researchers-scroll { animation: researchers-up linear infinite; }
      .researchers-mask:hover .researchers-scroll, .researchers-mask:focus-within .researchers-scroll { animation-play-state: paused; }
      .researchers-mask { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 8%, #000 92%, transparent); }
      @media (prefers-reduced-motion: reduce) {
        .researchers-scroll { animation: none; }
        .researchers-mask { overflow-y: auto; }
      }
    </style>
